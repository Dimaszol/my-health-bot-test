<!DOCTYPE html>
<html>
<head>
    <title>GPT Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        button { background: #00C9A7; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:disabled { background: #aaa; }
        #result { margin-top: 20px; padding: 16px; background: #f5f5f5; border-radius: 8px; white-space: pre-wrap; min-height: 60px; }
        label { font-weight: bold; display: block; margin-top: 16px; }
        select { padding: 8px; border-radius: 6px; border: 1px solid #ccc; }
        .meta { font-size: 12px; color: #888; margin-top: 8px; }
    </style>
</head>
<body>
    <h2>🧪 GPT API Test</h2>

    <label>System Prompt:</label>
    <textarea id="systemPrompt" rows="4">You are a medical assistant. Generate a short document title in Ukrainian.</textarea>

    <label>User Message:</label>
    <textarea id="userMessage" rows="6" placeholder="Enter text here..."></textarea>

    <label>Language:</label>
    <select id="lang">
        <option value="uk">Ukrainian</option>
        <option value="ru">Russian</option>
        <option value="en">English</option>
        <option value="de">German</option>
    </select>

    <br><br>
    <button id="sendBtn" onclick="sendTest()">▶ Send</button>

    <div id="result">Result will appear here...</div>
    <div class="meta" id="meta"></div>

    <script>
        async function sendTest() {
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Sending...';
            document.getElementById('result').textContent = '';
            document.getElementById('meta').textContent = '';

            const text = document.getElementById('userMessage').value.trim();
            const lang = document.getElementById('lang').value;

            if (!text) {
                document.getElementById('result').textContent = 'Please enter a message.';
                btn.disabled = false;
                btn.textContent = '▶ Send';
                return;
            }

            try {
                const resp = await fetch('/api/test-gpt5', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        text, 
                        lang,
                        system_prompt: document.getElementById('systemPrompt').value.trim()
                    })
                });
                const data = await resp.json();

                if (data.success) {
                    document.getElementById('result').textContent = data.title || '(empty response)';
                    document.getElementById('meta').textContent = 
                        `Model: ${data.model} | Time: ${data.processing_time}ms | output_text: ${data.output_text}`;
                } else {
                    document.getElementById('result').textContent = '❌ Error: ' + data.error;
                }
            } catch (e) {
                document.getElementById('result').textContent = '❌ Network error: ' + e.message;
            }

            btn.disabled = false;
            btn.textContent = '▶ Send';
        }
    </script>
</body>
</html>
