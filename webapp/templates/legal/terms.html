<!-- webapp/templates/legal/terms.html -->
{% extends "base.html" %}

{% block title %}{{ legal_t('terms_title', lang) }} - PulseBook{% endblock %}

{% block content %}
<div class="legal-container" style="max-width: 900px; margin: 3rem auto; padding: 0 1.5rem;">
       
    <!-- Основной контент из одного ключа -->
    <div class="legal-content" style="line-height: 1.8; color: #333;">
        {{ legal_t('terms', lang)|safe }}
    </div>

    
</div>

<style>
.legal-content h1 {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
    color: #1a1a1a;
}

.legal-content h2 {
    font-size: 1.75rem;
    margin: 2rem 0 1rem;
    color: #1a1a1a;
}

.legal-content h3 {
    font-size: 1.25rem;
    margin: 1.5rem 0 0.75rem;
    color: #2c5282;
}

.legal-content p {
    margin: 0.75rem 0;
}

.legal-content ul {
    margin: 1rem 0;
    padding-left: 2rem;
}

.legal-content li {
    margin: 0.5rem 0;
}

.legal-content a {
    color: #0066cc;
    text-decoration: underline;
}

.legal-content a:hover {
    color: #004499;
}

.legal-content strong {
    font-weight: 600;
    color: #1a1a1a;
}

.legal-content hr {
    border: none;
    border-top: 1px solid #e5e5e5;
    margin: 2rem 0;
}
</style>
{% endblock %}
